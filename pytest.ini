[pytest]
# no:unraisableexception: pytest 8.4 runs gc.collect() after every test for it (~0.4 s each here)
# -n 1: docs/SPEC-v5.3 M4: one worker so test runs leave a CPU for the live shop (scripts/test.sh adds nice);
# -n 2 (one per CPU) is faster when the shop is quiet; each worker has its own test database (tests/conftest.py)
addopts = -p no:unraisableexception -n 1
