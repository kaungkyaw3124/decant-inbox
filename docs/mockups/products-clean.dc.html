<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Products and prices</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#0A5BD8;text-decoration:none}a:hover{text-decoration:underline}
button{font-family:inherit}
</style>
</helmet>
<div style="min-height: 1080px; display: flex; flex-wrap: wrap; background: #F2F2F7; color: #000; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', Inter, system-ui, sans-serif; font-size: 15px">

<aside style="width: 220px; flex: none; box-sizing: border-box; padding: 24px 10px 16px; background: #FBFBFD; border-right: 1px solid #E5E5EA; display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 20px; font-weight: 700; padding: 0 10px 18px">Decant</div>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 10px; color: #1C1C1E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#007AFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/></svg><span style="flex: 1">Chats</span></a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 10px; color: #1C1C1E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#007AFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg><span style="flex: 1">Orders</span><span style="font-size: 12px; font-weight: 600; background: #FF3B30; color: #fff; border-radius: 10px; padding: 1px 7px">3</span></a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 10px; color: #1C1C1E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#007AFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2.5"/><path d="M2.5 10h19"/></svg><span style="flex: 1">Payments</span></a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 10px; background: #007AFF; color: #fff; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.2 6 10.5A6 6 0 0 1 6 13.5C6 9.2 12 3 12 3z"/></svg><span style="flex: 1">Products &amp; prices</span></a>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 10px; color: #1C1C1E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#007AFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 20V11M12 20V4M19 20v-6"/></svg><span style="flex: 1">Sales</span></a>
<div style="flex: 1"></div>
<div style="display: flex; align-items: center; justify-content: space-between; background: #fff; border-radius: 12px; padding: 10px 12px; margin-bottom: 6px"><span>Auto-reply</span><span style="width: 48px; height: 28px; border-radius: 14px; background: #34C759; display: flex; align-items: center; justify-content: flex-end; padding: 0 2px; box-sizing: border-box"><span style="width: 24px; height: 24px; border-radius: 12px; background: #fff"></span></span></div>
<a href="#" style="display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 10px; color: #1C1C1E"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#007AFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span style="flex: 1">Settings</span></a>
</aside>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 32px 40px 48px">
<div style="max-width: 1120px; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px">
<div>
<h1 style="margin: 0; font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: -0.5px">Products &amp; prices</h1>
<div style="margin-top: 4px; color: #6C6C70">38 perfumes · prices in Ks</div>
</div>
<div style="display: flex; background: #E3E3E8; border-radius: 10px; padding: 2px">
<button style="border: 0; background: #fff; border-radius: 8px; padding: 7px 18px; font-size: 14px; font-weight: 600; color: #000; box-shadow: 0 1px 2px rgba(0,0,0,.12)">Products</button>
<button style="border: 0; background: transparent; padding: 7px 18px; font-size: 14px; color: #3C3C43">Prices</button>
<button style="border: 0; background: transparent; padding: 7px 18px; font-size: 14px; color: #3C3C43">Stock</button>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
<label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Search product or alias</label>
<div style="flex: 1 1 320px; display: flex; align-items: center; gap: 10px; background: #fff; border-radius: 12px; padding: 0 14px; height: 44px; box-sizing: border-box; border: 1px solid #E5E5EA">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6C6C70" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
<input id="q" placeholder="Search product or alias" style="flex: 1; border: 0; outline: 0; font: inherit; font-size: 15px; background: transparent; min-width: 0">
</div>
<button style="height: 44px; border: 0; border-radius: 12px; background: #007AFF; color: #fff; font-size: 15px; font-weight: 600; padding: 0 22px">Search</button>
<button aria-label="Help" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #D1D1D6; background: #fff; color: #3C3C43; font-size: 15px; font-weight: 600">?</button>
</div>

<div style="background: #fff; border-radius: 16px; border: 1px solid #E5E5EA; overflow-x: auto">
<div style="min-width: 860px">
<div style="display: flex; align-items: center; gap: 16px; padding: 12px 20px; font-size: 12px; font-weight: 600; letter-spacing: .4px; text-transform: uppercase; color: #6C6C70; border-bottom: 1px solid #E5E5EA">
<div style="flex: 1 1 240px">Perfume</div>
<div style="flex: 2 1 380px">Prices (Ks)</div>
<div style="width: 70px; text-align: right">Aliases</div>
<div style="width: 90px; text-align: right">Messages</div>
</div>

<sc-for list="{{rows}}" as="r" hint-placeholder-count="10">
<div style="display: flex; align-items: center; gap: 16px; padding: 14px 20px; border-bottom: 1px solid #F0F0F3">
<div style="flex: 1 1 240px; min-width: 0">
<div style="font-size: 12px; color: #6C6C70">{{r.brand}}</div>
<a href="#" style="font-size: 16px; font-weight: 600; color: #000">{{r.name}}</a>
<sc-if value="{{r.isNew}}" hint-placeholder-val="{{ false }}"><span style="margin-left: 8px; font-size: 11px; font-weight: 600; color: #1F7A3A; background: #E3F6E8; border-radius: 6px; padding: 2px 7px">Added here</span></sc-if>
</div>
<div style="flex: 2 1 380px; display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{r.prices}}" as="p" hint-placeholder-count="4">
<span style="font-size: 13px; background: #F2F2F7; border-radius: 8px; padding: 4px 9px; color: #1C1C1E"><span style="color: #6C6C70">{{p.size}}</span> <strong style="font-weight: 600">{{p.price}}</strong></span>
</sc-for>
</div>
<div style="width: 70px; text-align: right; color: #3C3C43">{{r.aliases}}</div>
<div style="width: 90px; text-align: right"><a href="#" style="font-weight: 600">{{r.messages}}</a></div>
</div>
</sc-for>

<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px">
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #3C3C43">
<span>Show</span>
<div style="display: flex; background: #E3E3E8; border-radius: 9px; padding: 2px">
<button style="border: 0; background: #fff; border-radius: 7px; padding: 5px 12px; font-size: 13px; font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12)">10</button>
<button style="border: 0; background: transparent; padding: 5px 12px; font-size: 13px; color: #3C3C43">20</button>
<button style="border: 0; background: transparent; padding: 5px 12px; font-size: 13px; color: #3C3C43">50</button>
<button style="border: 0; background: transparent; padding: 5px 12px; font-size: 13px; color: #3C3C43">100</button>
</div>
<span>1–10 of 38</span>
</div>
<div style="display: flex; gap: 6px">
<button aria-label="Previous page" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #D1D1D6; background: #fff; color: #AEAEB2">‹</button>
<button style="width: 36px; height: 36px; border-radius: 10px; border: 0; background: #007AFF; color: #fff; font-weight: 600">1</button>
<button style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #D1D1D6; background: #fff; color: #1C1C1E">2</button>
<button style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #D1D1D6; background: #fff; color: #1C1C1E">3</button>
<button style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #D1D1D6; background: #fff; color: #1C1C1E">4</button>
<button aria-label="Next page" style="width: 36px; height: 36px; border-radius: 10px; border: 1px solid #D1D1D6; background: #fff; color: #1C1C1E">›</button>
</div>
</div>
</div>
</div>

</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1080}}'>
class Component extends DCLogic {
  renderVals() {
    const P = (a, b, c, d) => [
      { size: '2 ml', price: a }, { size: '5 ml', price: b }, { size: '10 ml', price: c }, { size: 'Full', price: d }
    ];
    return {
      rows: [
        { brand: 'Carolina Herrera', name: 'Good Girl', prices: P('9,000', '21,000', '40,000', '80 ml · 420,000'), aliases: 2, messages: 9 },
        { brand: 'Chanel', name: 'Bleu de Chanel Eau de Parfum', prices: P('10,000', '23,000', '43,000', '100 ml · 480,000'), aliases: 4, messages: 0 },
        { brand: 'Creed', name: 'Aventus', prices: P('28,000', '65,000', '125,000', '100 ml · 1,150,000'), aliases: 2, messages: 0 },
        { brand: 'Dior', name: 'Miss Dior', prices: P('9,000', '21,000', '40,000', '100 ml · 450,000'), aliases: 1, messages: 0 },
        { brand: 'Dior', name: 'Sauvage Eau de Parfum', prices: P('9,000', '20,000', '38,000', '100 ml · 420,000'), aliases: 4, messages: 0 },
        { brand: 'Dior', name: 'Sauvage Elixir', prices: P('12,000', '28,000', '52,000', '60 ml · 520,000'), aliases: 2, messages: 0 },
        { brand: 'Emporio Armani', name: 'Stronger With You', prices: P('7,000', '16,000', '30,000', '100 ml · 330,000'), aliases: 3, messages: 2 },
        { brand: 'Emporio Armani', name: 'Stronger With You Intensely', prices: P('8,000', '18,000', '33,000', '100 ml · 380,000'), aliases: 7, messages: 8 },
        { brand: 'Giorgio Armani', name: 'Acqua di Gio Profumo', prices: P('10,000', '23,000', '43,000', '75 ml · 400,000'), aliases: 4, messages: 0 },
        { brand: 'Hawas', name: 'Hawas Ice', prices: P('6,000', '12,000', '20,000', '105 ml · 180,000'), aliases: 1, messages: 0, isNew: true }
      ]
    };
  }
}
</script>
</body>
</html>
