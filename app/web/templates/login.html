{% extends "base.html" %}
{% block title %}{{ t("Log in") }} · Decant Inbox{% endblock %}
{% block content %}
<form method="post" action="/login" class="card login">
  <h1>Decant Inbox</h1>
  {% if error %}<p class="error" role="alert">{{ tr(error) }}{% if lang == "my" %} <span lang="en" class="small">({{ error }})</span>{% endif %}</p>{% endif %}
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="next" value="{{ next }}">
  <label>{{ t("Username") }} <input name="username" autocomplete="username" autocapitalize="none" required autofocus></label>
  <label>{{ t("Password") }} <input name="password" type="password" autocomplete="current-password" required></label>
  <button class="primary">{{ t("Log in") }}</button>
</form>
{% endblock %}
