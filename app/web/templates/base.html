<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
<title>{% block title %}Decant Inbox{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
<script src="/static/htmx-2.0.4.min.js" defer></script>
<script src="/static/quick.js" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
{% if request.session.get("user_id") %}
<header class="top">
  <a class="brand" href="/">Decant Inbox</a>
  <nav>
    <a href="/" {% if path == "/" %}aria-current="page"{% endif %}>Inbox</a>
    <a href="/chats" {% if path.startswith("/chats") %}aria-current="page"{% endif %}>Chats</a>
    <a href="/products" {% if path.startswith("/products") %}aria-current="page"{% endif %}>Products</a>
    <a href="/prices" {% if path.startswith("/prices") %}aria-current="page"{% endif %}>Prices</a>
    <a href="/settings" {% if path.startswith("/settings") %}aria-current="page"{% endif %}>Settings</a>
    <a href="/health" {% if path == "/health" %}aria-current="page"{% endif %}>Health</a>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="link">Log out</button>
    </form>
  </nav>
</header>
{% endif %}
<main class="{% block main_class %}{% endblock %}">
{% if flash %}<p class="flash" role="status">{{ flash }}</p>{% endif %}
{% block content %}{% endblock %}
</main>
</body>
</html>
