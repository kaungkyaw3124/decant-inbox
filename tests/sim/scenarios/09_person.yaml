- id: person-wholesale
  hand: true
  tags: [outside]
  turns:
    - say: "လက်ကား ယူချင်လို့ 50 ခုလောက် ဈေးလျှော့ပေးလို့ရလား"
      expect: {reply: person}

- id: person-cancel-paid
  hand: true
  tags: [paid]
  setup: {state: paid, items: ["Eros 10ml"], age_min: 60}
  turns:
    - say: "order cancel ချင်တယ်"
      expect: {reply: person}
