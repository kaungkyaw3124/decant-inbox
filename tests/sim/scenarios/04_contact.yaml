# Phone and address: same message, Yangon / Mandalay grid / other cities, partial addresses. hand: true.

- id: contact-step-by-step-yangon
  hand: true
  tags: [contact, yangon]
  turns:
    - say: "eros 10ml ယူမယ်"
      expect: {reply: auto, contains: ["ဖုန်းနံပါတ်"], cart: ["Eros 10ml x1"]}
    - say: "09420001111"
      expect: {reply: auto, contains: ["09420001111", "လိပ်စာ"], phone: "09420001111"}
    - say: "အမှတ် 45, ဗိုလ်ချုပ်လမ်း, ဗဟန်းမြို့နယ်"
      expect: {reply: auto, contains: ["KPay – 09000000001", "25,000"], status: waiting_payment, township: Bahan}

- id: contact-phone-and-address-together
  hand: true
  tags: [contact, same-message]
  turns:
    - say: "libre 5ml ယူမယ်"
      expect: {reply: auto, cart: ["Libre 5ml x1"]}
    - say: "09420002222 အမှတ် 7 ၊ ပြည်လမ်း၊ ကမာရွတ်"
      expect: {reply: auto, contains: ["KPay – 09000000001"], status: waiting_payment, phone: "09420002222", township: Kamayut}

- id: contact-all-in-one-message
  hand: true
  tags: [contact, same-message]
  turns:
    - say: "aventus 5ml ယူမယ် 09420003333 အမှတ် 12 ၊ အင်းလျားလမ်း ၊ ဗဟန်း"
      expect: {reply: auto, contains: ["Aventus 5ml – 65,000", "09420003333"], cart: ["Aventus 5ml x1"], phone: "09420003333"}
    - say: "ဟုတ်ကဲ့"
      expect: {reply: auto, contains: ["KPay – 09000000001"], status: waiting_payment}

- id: contact-mandalay-grid
  hand: true
  tags: [contact, mandalay, grid]
  turns:
    - say: "eros 5ml ယူမယ်"
      expect: {reply: auto}
    - say: "09420004444"
      expect: {reply: auto, contains: ["လိပ်စာ"]}
    - say: "35 x 66 လမ်း"
      expect: {reply: auto, contains: ["KPay – 09000000001"], city: Mandalay}

- id: contact-mandalay-with-city
  hand: true
  tags: [contact, mandalay]
  turns:
    - say: "bdc 5ml ယူမယ်"
      expect: {reply: auto}
    - say: "09420005555\n62 လမ်း 30x31 ကြား မန္တလေး"
      expect: {reply: auto, contains: ["KPay – 09000000001"], city: Mandalay}

