- id: contact-returning-customer-confirm
  hand: true
  tags: [contact, returning]
  setup: {state: browsing, saved: true, age_min: 3000}
  turns:
    - say: "eros 10ml ယူမယ်"
      expect: {reply: auto, contains: ["Eros 10ml – 25,000", "09400000001", "ကိုပဲ ပို့ပေးရမလား"]}
    - say: "ok"
      expect: {reply: auto, contains: ["KPay – 09000000001"], status: waiting_payment}

- id: contact-returning-new-address
  hand: true
  tags: [contact, returning]
  setup: {state: browsing, saved: true, age_min: 3000}
