      expect: {reply: auto}
    - say: "09420007777"
      expect: {reply: auto, contains: ["လိပ်စာ"]}
    - say: "ဗဟန်း"
      expect: {reply: auto, any_of: ["အပြည့်အစုံ", "လိပ်စာ", "KPay"]}

