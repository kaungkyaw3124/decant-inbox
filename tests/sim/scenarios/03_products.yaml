# Sizes not sold, unknown products, similar names. hand: true.

- id: size-20ml-not-sold
  hand: true
  tags: [size]
  turns:
    - say: "eros 20ml ယူမယ်"
      expect: {reply: auto, contains: ["20ml မရှိပါဘူး", "10ml – 25,000", "ဘယ် size ယူမလဲ"], cart: []}
    - say: "10ml ပဲယူမယ်"
      expect: {reply: auto, contains: ["Eros 10ml – 25,000"], cart: ["Eros 10ml x1"]}

