- id: unclear-dior-something
  hand: true
  tags: [unclear, choice]
  turns:
    - say: "dior ဟိုဟာလေး ရှိလား"
      expect: {reply: auto, contains: ["1", "2"], any_of: ["Sauvage Eau de Parfum", "Miss Dior"], products: ["Sauvage Eau de Parfum", "Sauvage Elixir", "Miss Dior"]}
    - say: "2"
      expect: {reply: auto, any_of: ["ကျပ်"], products: ["Sauvage Eau de Parfum", "Sauvage Elixir", "Miss Dior"]}

- id: unclear-ysl-10ml
