# Live bugs of October 2026 (4.8-4.17 screenshots, retold with TEST data — never real customer text).
# hand: true, must pass forever.

- id: live-1027-size-not-sold
  hand: true
  tags: [live, size, address, grid]
  turns:
    - say: "Swy intensely 20ml ယူပါမယ်\n66 str 28 str ကိုပို့ပေးပါ\n09958745521"
      expect:
        reply: auto
        contains: ["20ml မရှိပါဘူး", "10ml – 33,000", "ဘယ် size ယူမလဲ"]
        not_contains: ["Stronger With You Intensely 2ml –"]
        cart: []
    - say: "10ml"
      expect:
        reply: auto
        contains: ["Stronger With You Intensely 10ml – 33,000", "09958745521", "66 str 28 str"]
        cart: ["Stronger With You Intensely 10ml x1"]
        phone: "09958745521"
        city: Mandalay
    - say: "ok"
      expect:
        reply: auto
        contains: ["KPay – 09000000001", "screenshot"]
        status: waiting_payment

